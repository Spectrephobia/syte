# Render Blueprint — https://render.com/docs/blueprint-spec
# In Render: New → Blueprint → pick this GitHub repo. Render reads this file.
services:
  - type: web
    name: baland
    runtime: node
    plan: free            # free = no persistent disk (data resets on each deploy/restart)
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /robots.txt
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        value: file:./db/custom.db
      - key: ADMIN_EMAIL
        sync: false       # you enter it in the Render dashboard
      - key: ADMIN_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false       # e.g. https://baland.onrender.com or your own domain

    # ---- To keep data permanently (paid plan, e.g. "starter") ----
    # 1. change `plan: free` above to `plan: starter`
    # 2. uncomment the disk below
    # 3. set DATABASE_URL to file:/var/data/baland.db and add UPLOAD_DIR=/var/data/uploads
    # disk:
    #   name: baland-data
    #   mountPath: /var/data
    #   sizeGB: 1
